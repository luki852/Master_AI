name: ppo-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - swig
  - pyopengl
  - matplotlib
  - seaborn
  - ipykernel
  - ipython
  - ipywidgets
  - tqdm
  - pip:
      - jax==0.7.2
      - jaxlib==0.7.2
      - gymnasium==1.2.3
      - "gymnasium[box2d]"
      - pyvirtualdisplay
      - imageio-ffmpeg
      - moviepy==1.0.3
      - onnx==1.20.0
      - onnx2pytorch==0.5.3
      - numpy==2.4.2
      - torch
